<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="LEAD-GUÍA orb">
  <defs>
    <radialGradient id="lg-core" cx="35%" cy="28%" r="85%">
      <stop offset="0%" stop-color="#FFD04A"/>
      <stop offset="42%" stop-color="#FFB819"/>
      <stop offset="72%" stop-color="#DD7102"/>
      <stop offset="100%" stop-color="#A52475"/>
    </radialGradient>
    <linearGradient id="lg-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD04A"/>
      <stop offset="100%" stop-color="#7E34A0"/>
    </linearGradient>
    <filter id="lg-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ondas de voz -->
  <g stroke="url(#lg-ring)" stroke-width="2" stroke-linecap="round" opacity="0.85">
    <path d="M32 5a30 30 0 0 1 0 54"/>
    <path d="M32 13a21 21 0 0 1 0 38" opacity="0.55"/>
  </g>

  <!-- orbe -->
  <circle cx="32" cy="32" r="15" fill="url(#lg-core)" filter="url(#lg-glow)"/>
  <ellipse cx="26" cy="26" rx="5" ry="3.2" fill="#FFFFFF" opacity="0.55" transform="rotate(-24 26 26)"/>
</svg>
